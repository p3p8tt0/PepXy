name: Sync fork with upstream

on:
  schedule:
    - cron: '*/15 * * * *'   # ogni 15 minuti, personalizzabile
  workflow_dispatch:          # permette anche l'avvio manuale

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # cambia col nome del tuo branch principale

      - name: Aggiungi remote upstream
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy
          git fetch upstream

      - name: Merge upstream nel fork
        run: |
          git merge upstream/main --no-edit
          git push origin main

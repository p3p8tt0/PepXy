name: Sync fork with upstream

on:
  schedule:
    - cron: '*/30 * * * *'   # ogni 30 minuti, personalizzabile
  workflow_dispatch:          # permette anche il trigger manuale

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and sync
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only
          git push origin main
